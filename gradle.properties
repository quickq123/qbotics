org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Versions. Find the latest NeoForge at https://projects.neoforged.net/neoforged/neoforge
# The Minecraft, NeoForge and NeoForm versions must agree.
minecraft_version=26.1.2
minecraft_version_range=[26.1.2]
neo_version=26.1.2.126
# NeoForm = plain Minecraft, used by the 'common' module so it can't touch loader APIs.
neoform_version=26.1.2-1
chicory_version=1.7.5
# The SSH gateway (design doc 9.5): Apache MINA SSHD, and EdDSA for ed25519 keys.
sshd_version=2.14.0
eddsa_version=0.3.0

# Mod properties. The mod ID is permanent: it is in every block name and save file.
mod_id=qbotics
mod_name=Qbotics
mod_license=Unlicense
mod_version=0.2.0
mod_group_id=qbotics
